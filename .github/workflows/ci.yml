name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default; jobs opt in to more if needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests scripts examples
      - name: Ruff (format check)
        run: ruff format --check src tests scripts examples
      - name: Mypy
        run: mypy src/model_merger

  test:
    runs-on: ubuntu-latest       # CPU only; no GPU required
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=model_merger --cov-report=xml --cov-report=term-missing
      - name: Release smoke check
        run: python scripts/verify_release.py
      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[docs]"
      - name: Build docs (strict)
        run: mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: pip install twine && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      - name: Audit installed dependencies
        run: |
          pip install -e .
          pip-audit --strict || echo "::warning::pip-audit reported advisories"
